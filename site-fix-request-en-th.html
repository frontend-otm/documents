<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Fix Request</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --fg:#37352f; --muted:#787774; --line:#e9e9e7; --hover:#f1f1ef; --soft:#f7f7f5;
  --callout:#f1f1ef; --code:#f7f6f3; --code-fg:#eb5757; --link:#37352f; --accent:#2383e2;
  --t-red-bg:#ffe2dd; --t-red-fg:#5d1715; --t-blue-bg:#d3e5ef; --t-blue-fg:#183347;
  --t-yel-bg:#fdecc8; --t-yel-fg:#402c1b; --t-pink-bg:#f5e0e9; --t-pink-fg:#4c2337;
  --t-green-bg:#dbeddb; --t-green-fg:#1c3829; --t-gray-bg:#e3e2e0; --t-gray-fg:#32302c;
  --c-brown:#f4eeee; --shadow:0 4px 18px rgba(15,15,15,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191919; --fg:#d4d4d4; --muted:#9b9b9b; --line:#2f2f2f; --hover:#2a2a2a; --soft:#202020;
    --callout:#252525; --code:#2a2a2a; --code-fg:#ff7369; --link:#d4d4d4; --accent:#529cca;
    --t-red-bg:#6e3630; --t-red-fg:#fce9e7; --t-blue-bg:#28456c; --t-blue-fg:#e5f2fc;
    --t-yel-bg:#594a3a; --t-yel-fg:#f0efed; --t-pink-bg:#69314c; --t-pink-fg:#fae9f1;
    --t-green-bg:#2b593f; --t-green-fg:#e8f1ec; --t-gray-bg:#373737; --t-gray-fg:#f0efed;
    --c-brown:#2e2724; --shadow:0 4px 18px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#191919; --fg:#d4d4d4; --muted:#9b9b9b; --line:#2f2f2f; --hover:#2a2a2a; --soft:#202020;
  --callout:#252525; --code:#2a2a2a; --code-fg:#ff7369; --link:#d4d4d4; --accent:#529cca;
  --t-red-bg:#6e3630; --t-red-fg:#fce9e7; --t-blue-bg:#28456c; --t-blue-fg:#e5f2fc;
  --t-yel-bg:#594a3a; --t-yel-fg:#f0efed; --t-pink-bg:#69314c; --t-pink-fg:#fae9f1;
  --t-green-bg:#2b593f; --t-green-fg:#e8f1ec; --t-gray-bg:#373737; --t-gray-fg:#f0efed;
  --c-brown:#2e2724; --shadow:0 4px 18px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
html[lang="th"] body{font-family:"Noto Sans Thai",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.7}
a{color:var(--link);text-decoration:underline;text-decoration-color:var(--muted);text-underline-offset:2px;word-break:break-all}
a:hover{text-decoration-color:var(--fg)}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;height:45px;padding:0 12px;background:var(--bg);border-bottom:1px solid transparent}
.topbar.scrolled{border-bottom-color:var(--line)}
.crumbs{display:flex;align-items:center;gap:2px;min-width:0;flex:1;font-size:14px;overflow:hidden;white-space:nowrap}
.crumbs a,.crumbs span{padding:2px 6px;border-radius:4px;text-decoration:none;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.crumbs a:hover{background:var(--hover)}
.crumbs .sep{color:var(--muted);padding:0 1px}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;padding:3px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--hover);color:var(--fg);font-weight:600}
.page{max-width:900px;margin:0 auto;padding:40px 96px 120px}
.page.wide{max-width:1200px}
@media (max-width:760px){.page{padding:28px 16px 100px}}
.pg-icon{font-size:72px;line-height:1;margin:0 0 8px}
h1.pg-title{font-size:40px;line-height:1.2;font-weight:700;margin:0 0 16px;word-break:break-word}
@media (max-width:760px){h1.pg-title{font-size:30px}.pg-icon{font-size:56px}}
.props{margin:0 0 8px;font-size:14px}
.prop{display:flex;align-items:flex-start;min-height:34px;padding:4px 0}
.prop .k{flex:0 0 180px;color:var(--muted);display:flex;align-items:center;gap:6px;padding:3px 6px}
.prop .v{flex:1;padding:3px 6px;min-width:0;word-break:break-word}
.prop .v.empty{color:var(--muted);opacity:.7}
@media (max-width:560px){.prop .k{flex-basis:120px}}
.more-btn{border:0;background:none;color:var(--muted);font:inherit;font-size:14px;padding:4px 6px;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:6px}
.more-btn:hover{background:var(--hover)}
.divider{border:0;border-top:1px solid var(--line);margin:12px 0 20px}
.tag{display:inline-block;padding:0 6px;border-radius:3px;font-size:14px;line-height:20px;margin:0 4px 2px 0;white-space:nowrap}
.tag.red{background:var(--t-red-bg);color:var(--t-red-fg)}
.tag.blue{background:var(--t-blue-bg);color:var(--t-blue-fg)}
.tag.yel{background:var(--t-yel-bg);color:var(--t-yel-fg)}
.tag.pink{background:var(--t-pink-bg);color:var(--t-pink-fg)}
.tag.green{background:var(--t-green-bg);color:var(--t-green-fg)}
.tag.gray{background:var(--t-gray-bg);color:var(--t-gray-fg)}
.content h2{font-size:24px;font-weight:600;line-height:1.3;margin:36px 0 6px;scroll-margin-top:60px}
.content h3{font-size:20px;font-weight:600;line-height:1.3;margin:28px 0 4px;scroll-margin-top:60px}
.content h4{font-size:17px;font-weight:600;margin:20px 0 4px;scroll-margin-top:60px}
.content p{margin:4px 0;min-height:1em}
.content ul,.content ol{margin:4px 0;padding-left:26px}
.content li{margin:2px 0}
.callout{display:flex;gap:10px;padding:16px 16px 16px 12px;border-radius:6px;background:var(--callout);margin:6px 0}
.callout.brown{background:var(--c-brown)}
.callout .ico{font-size:21px;line-height:1.3;flex:none;width:26px;text-align:center}
.callout .cb{flex:1;min-width:0}
.callout .cb>:first-child{margin-top:0}
pre.code{background:var(--code);border-radius:4px;padding:16px 18px;overflow-x:auto;font:13.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;margin:8px 0;white-space:pre}
code.i{background:var(--code);color:var(--code-fg);border-radius:4px;padding:1px 5px;font:.86em ui-monospace,SFMono-Regular,Menlo,monospace}
.red-t{color:#e03e3e}
figure.img{margin:10px 0}
figure.img img{max-width:100%;height:auto;border-radius:4px;display:block;background:var(--soft)}
figure.img figcaption{font-size:13px;color:var(--muted)}
.toggle>summary{list-style:none;cursor:pointer;display:flex;align-items:flex-start;gap:4px;padding:2px 0;border-radius:4px}
.toggle>summary::-webkit-details-marker{display:none}
.toggle>summary .tri{flex:none;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;transition:transform .15s;color:var(--fg)}
.toggle>summary .tri:hover{background:var(--hover)}
.toggle[open]>summary .tri{transform:rotate(90deg)}
.toggle>summary .tt{flex:1}
.toggle>.tb{padding-left:28px}
.toggle.h2>summary .tt{font-size:24px;font-weight:600;line-height:1.3}
.toggle.h3>summary .tt{font-size:20px;font-weight:600;line-height:1.3}
.toggle.h2,.toggle.h3{margin-top:28px}
.toggle.h2>summary .tri,.toggle.h3>summary .tri{margin-top:2px}
.toc{display:block;padding:0;margin:0;list-style:none}
.toc a{display:block;text-decoration:none;color:var(--fg);padding:3px 4px;border-bottom:1px solid var(--line);border-radius:3px;font-size:15px;word-break:normal}
.toc a:hover{background:var(--hover)}
.toc .l2 a{padding-left:24px}.toc .l3 a{padding-left:48px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:8px 0}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.tbl-wrap{overflow-x:auto;margin:8px 0}
table.simple{border-collapse:collapse;font-size:14px;min-width:100%}
table.simple td,table.simple th{border:1px solid var(--line);padding:7px 9px;vertical-align:top;text-align:left}
table.simple th,table.simple td.hc{background:var(--soft);font-weight:600}
/* database */
.db{margin:28px 0 8px}
.db-title{display:inline-flex;align-items:center;gap:6px;font-size:20px;font-weight:600;padding:2px 4px;border-radius:4px;text-decoration:none;color:var(--fg);cursor:pointer;word-break:normal}
.db-title:hover{background:var(--hover)}
.db-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 4px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:32px;padding:1px 10px;font-size:13px;color:var(--accent);background:transparent;cursor:pointer;font-family:inherit}
.chip.off{color:var(--muted)}
.db-scroll{overflow-x:auto;border-top:1px solid var(--line)}
table.dbt{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
table.dbt th{font-weight:400;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap}
table.dbt td{padding:7px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top}
table.dbt th:last-child,table.dbt td:last-child{border-right:0}
table.dbt tbody tr{cursor:pointer}
table.dbt tbody tr:hover td{background:var(--hover)}
table.dbt td.no{font-weight:600;white-space:nowrap}
table.dbt td.no .open{display:none;margin-left:8px;font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--bg)}
table.dbt tbody tr:hover td.no .open{display:inline-block}
table.dbt td.stars{white-space:nowrap;letter-spacing:1px}
.db-empty{color:var(--muted);font-size:14px;padding:10px 8px;border-bottom:1px solid var(--line)}
.db-count{color:var(--muted);font-size:13px;padding:6px 8px}
.icon-p{width:16px;text-align:center;opacity:.8}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);text-decoration:none;padding:3px 6px;border-radius:4px;margin:0 0 16px -6px}
.back:hover{background:var(--hover);color:var(--fg)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:48px;border-top:1px solid var(--line);padding-top:16px;font-size:14px}
.pager a{text-decoration:none;padding:8px 10px;border-radius:6px;border:1px solid var(--line);max-width:48%;word-break:normal}
.pager a:hover{background:var(--hover)}
.pager small{display:block;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:56px;border-top:1px solid var(--line);padding-top:12px}
</style>
</head>
<body>
<header class="topbar" id="topbar">
  <nav class="crumbs" id="crumbs"></nav>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="th">ไทย</button>
  </div>
</header>
<main id="app"></main>

<script>
(function(){
"use strict";

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const A = (url, text) => `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${text ? text : esc(url)}</a>`;
const C = s => `<code class="i">${esc(s)}</code>`;
const P = (...lines) => lines.map(l => ["p", l]);
const IMGBASE = "https://artistic-flame-972.notion.site/image/attachment%3A";
const IMG = (att, blk, w) => ["img", `${IMGBASE}${att}%3Aimage.png?table=block&id=${blk}&spaceId=81d8034a-9b19-49d2-b3c4-472a7d2e8aff&width=${w||1410}&userId=&cache=v2`];

const SH_BROKEN = "https://docs.google.com/spreadsheets/d/1sDUCTUQ_qhaF8T6EVr7NXN7cvHijYFA8tO5oBNfiwM4/edit?gid=527858378#gid=527858378";
const SH_TITLE  = "https://docs.google.com/spreadsheets/d/1sDUCTUQ_qhaF8T6EVr7NXN7cvHijYFA8tO5oBNfiwM4/edit?gid=1734577079#gid=1734577079";
const SH_LQ     = "https://docs.google.com/spreadsheets/d/1sDUCTUQ_qhaF8T6EVr7NXN7cvHijYFA8tO5oBNfiwM4/edit?gid=677013016#gid=677013016";
const SH_LQ_OLD = "https://docs.google.com/spreadsheets/d/1ngNGQYAR5H8Ax0hVjJALflB2Q0n2vYHKJ5yPM7PjUJ4/edit?gid=677013016#gid=677013016";
const OD = "https://www.owndays.com/sg/en";

/* ---------- UI strings ---------- */
const UI = {
  en:{
    docTitle:"Site Fix Request (OWNDAYS Singapore)",
    pURL:"URL", pClient:"🏢 Client company master DB", pAnalyst:"Analyst", pSiteType:"Site type", pCreated:"Created",
    pMeasure:"Measure type", pDate:"Date", pProject:"Project name", pPM:"[Internal] PM design list (*old internal Notion)",
    pResult:"Results", pDeliv:"Deliverables", pPurpose:"Measure purpose", pIssue:"Issues",
    empty:"Empty", noAccess:"No access", more:n=>`${n} more properties`, hide:n=>`Hide ${n} properties`,
    dbSite:"DB site", ecSite:"EC site", created:"June 24, 2026", measureVal:"Site fix request",
    colNo:"No.", colTitle:"Fix item", colPri:"Priority", colJudge:"Assessment", colStatus:"Status",
    stNot:"Not started", jFix:"Needs fixing", jOk:"No particular issues",
    db1:"Audit results (1)", db2:"Audit results – continued (2)", db3:"Audit results – DB-type (3)",
    filterLbl:"Assessment: Contains Needs fixing", filter:"Filter", editFilters:"Edit filters", noResults:"No results",
    count:n=>`Count ${n}`, open:"OPEN",
    why:"[Why this work is needed]", cur:"Current status", act:"Action required",
    back:"Back", prev:"Previous", next:"Next",
    grpN:"General", grpD:"DB-type",
    sdTitle:"Structured data measures",
    sdCols:["Structured data type","Example page type","Reference URL","In audit scope","Example URL","Implemented","Errors","How to fix"],
    footer:"English translation of the original Japanese document. Links, images and spreadsheets point to the original sources (images contain Japanese text)."
  },
  th:{
    docTitle:"เอกสารขอแก้ไขเว็บไซต์ (OWNDAYS สิงคโปร์)",
    pURL:"URL", pClient:"🏢 ฐานข้อมูลบริษัทลูกค้า", pAnalyst:"นักวิเคราะห์", pSiteType:"ประเภทเว็บไซต์", pCreated:"วันที่สร้าง",
    pMeasure:"ประเภทมาตรการ", pDate:"วันที่", pProject:"ชื่อโปรเจกต์", pPM:"【ใช้ภายใน】รายการออกแบบ PM (*Notion ภายในเดิม)",
    pResult:"ผลลัพธ์", pDeliv:"ผลงานส่งมอบ", pPurpose:"วัตถุประสงค์ของมาตรการ", pIssue:"ปัญหา",
    empty:"ว่าง", noAccess:"ไม่มีสิทธิ์เข้าถึง", more:n=>`คุณสมบัติเพิ่มเติม ${n} รายการ`, hide:n=>`ซ่อนคุณสมบัติ ${n} รายการ`,
    dbSite:"เว็บไซต์แบบ DB", ecSite:"เว็บไซต์ EC", created:"24 มิถุนายน 2026", measureVal:"เอกสารขอแก้ไขเว็บไซต์",
    colNo:"No.", colTitle:"รายการแก้ไข", colPri:"ความสำคัญ", colJudge:"ผลการประเมิน", colStatus:"สถานะ",
    stNot:"ยังไม่เริ่ม", jFix:"มีจุดที่ต้องแก้ไข", jOk:"ไม่พบปัญหาเป็นพิเศษ",
    db1:"สรุปผลการตรวจสอบ (1)", db2:"สรุปผลการตรวจสอบ – ต่อเนื่อง (2)", db3:"สรุปผลการตรวจสอบ – ประเภท DB (3)",
    filterLbl:"ผลการประเมิน: มีคำว่า มีจุดที่ต้องแก้ไข", filter:"ตัวกรอง", editFilters:"แก้ไขตัวกรอง", noResults:"ไม่มีผลลัพธ์",
    count:n=>`จำนวน ${n}`, open:"เปิด",
    why:"【เหตุผลที่ต้องดำเนินการ】", cur:"สถานะปัจจุบัน", act:"สิ่งที่ต้องดำเนินการ",
    back:"ย้อนกลับ", prev:"ก่อนหน้า", next:"ถัดไป",
    grpN:"ทั่วไป", grpD:"ประเภท DB",
    sdTitle:"มาตรการด้าน Structured Data",
    sdCols:["ประเภท Structured Data","ตัวอย่างประเภทหน้า","URL อ้างอิง","อยู่ในขอบเขตตรวจสอบ","ตัวอย่าง URL","ติดตั้งแล้ว","มีข้อผิดพลาด","วิธีแก้ไข"],
    footer:"ฉบับแปลภาษาไทยจากเอกสารต้นฉบับภาษาญี่ปุ่น ลิงก์ รูปภาพ และสเปรดชีตอ้างอิงไปยังแหล่งข้อมูลต้นฉบับ (ข้อความในรูปภาพเป็นภาษาญี่ปุ่น)"
  }
};

/* standard item body: reason / current / action (+ extra blocks) */
function std(L, reason, current, action, extra){
  const u = UI[L];
  return [["h3", u.why], ["call","💡",reason], ["h4", u.cur], ["call","☹️",current], ["h4", u.act], ["call","🙂",action]].concat(extra||[]);
}
const REF_LQ = {
  en:(old)=>P(`☛ For the locations that need fixing, please refer to ${A(old?SH_LQ_OLD:SH_LQ,"Handling of low-quality / duplicate pages")}.`),
  th:(old)=>P(`☛ สำหรับจุดที่ต้องแก้ไข กรุณาดูที่ ${A(old?SH_LQ_OLD:SH_LQ,"การจัดการหน้าคุณภาพต่ำ / หน้าซ้ำ")}`)
};
const REF_LQ_OR = {
  en:()=>REF_LQ.en(true).concat(P("or","please refer to [Site fix request details.xlsx_Duplicate title page list].")),
  th:()=>REF_LQ.th(true).concat(P("หรือ","กรุณาดูที่ [รายละเอียดเอกสารขอแก้ไขเว็บไซต์.xlsx_รายการหน้าที่ title ซ้ำ]"))
};
const CAP = {en:"※Paste screenshot here※", th:"※วางภาพหน้าจอที่นี่※"};

/* ---------- items ---------- */
const ITEMS = [];
function add(id, grp, n, pri, fix, title, en, th){ ITEMS.push({id, grp, n, pri, fix, title, body:{en, th}}); }

/* General 1 */
add("n1",1,1,3,false,{en:"URL normalization",th:"การทำ URL ให้เป็นมาตรฐาน (URL Normalization)"},
 std("en",
  P(`Search engines treat URLs with/without "www", with/without "index.html", and "http"/"https" as separate sites.`,
    `If URLs are not unified, the effect of backlinks may be split and not be fully evaluated.`,
    `We therefore recommend redirecting any access to a URL that is not the canonical URL you want shown in search results to the canonical URL.`),
  P(`"With / without www"`,`"With / without index.html", "With / without index.php"`,`"http / https"`,`The above URLs, which display the same content, are not unified.`),
  [["p","We recommend redirecting any URL that is not the canonical URL you want shown in search results to the canonical URL."],
   ["p","<b>If redirects can be used</b>"],
   ["p","Please set up a 301 redirect via server settings or a program. On Apache servers, redirects can be configured in “.htaccess”."],
   ["p","<b>If redirects cannot be used</b>"],
   ["p",`If server-side redirects are not available, you can normalize the URL by adding a ${C('rel="canonical"')} setting to the page's HTML source.`],
   ["p","Example:"],["code",'<link rel="canonical" href="Canonical URL" />'],
   ["p","※If your Apache server supports “mod_rewrite”, redirects can be configured in the .htaccess file."],
   ["p","※If you use nginx, IIS or another server, please configure the redirect in the server settings."]]),
 std("th",
  P(`เครื่องมือค้นหา (Search Engine) จะมองว่า URL แบบ "มี/ไม่มี www", "มี/ไม่มี index.html" และ "http/https" เป็นคนละเว็บไซต์กัน`,
    `หากไม่รวม URL ให้เป็นแบบเดียวกัน ผลของ Backlink อาจกระจายออกไปและไม่ได้รับการประเมินอย่างเต็มที่`,

add("n4",1,4,2,true,{en:"Fixing <title> tags",th:"แก้ไขแท็ก <title>"},
 std("en",
  P("If <title> tags are duplicated across different pages, Google may not correctly understand the page content and an unintended page may be evaluated. Therefore, the <title> should be set individually for each page wherever possible. Setting appropriate keywords for each page can also be expected to increase traffic from long-tail keywords.".replace(/</g,"&lt;")),
  [["p","There are pages whose &lt;title&gt; tag text is duplicated."],["p","Example: many product detail pages share the common title “Buy Online - Owndays SG”"],["p",A(OD+"/air-au2104a-4a-c4-eyeframe.html")],["p",A(OD+"/air-au2109a-5s-c4-eyeframe.html")]],
  P("Please set unique text in the title tag of each page.","It is effective to include the keywords you want each page to rank for.",`☛ For the locations that need fixing, please refer to the ${A(SH_TITLE,"Duplicate title page list")}.`)),
 std("th",
  P("หากแท็ก &lt;title&gt; ซ้ำกันระหว่างหน้าต่าง ๆ Google อาจไม่สามารถเข้าใจเนื้อหาของหน้าได้อย่างถูกต้อง และอาจประเมินหน้าที่ไม่ได้ตั้งใจ ดังนั้นควรตั้งค่า &lt;title&gt; แยกเฉพาะของแต่ละหน้าให้มากที่สุดเท่าที่ทำได้ นอกจากนี้ การกำหนดคีย์เวิร์ดที่เหมาะสมให้แต่ละหน้ายังช่วยเพิ่ม Traffic จาก Long-tail Keyword ได้"),
  [["p","มีหน้าที่ข้อความในแท็ก &lt;title&gt; ซ้ำกัน"],["p","ตัวอย่าง: หน้ารายละเอียดสินค้าจำนวนมากใช้ title เดียวกันคือ “Buy Online - Owndays SG”"],["p",A(OD+"/air-au2104a-4a-c4-eyeframe.html")],["p",A(OD+"/air-au2109a-5s-c4-eyeframe.html")]],
  P("กรุณากำหนดข้อความที่ไม่ซ้ำกันในแท็ก title ของแต่ละหน้า","การใส่คีย์เวิร์ดที่ต้องการให้แต่ละหน้าติดอันดับสูงจะได้ผลดี",`☛ สำหรับจุดที่ต้องแก้ไข กรุณาดูที่ ${A(SH_TITLE,"รายการหน้าที่ title ซ้ำ")}`))
);

function mobileSub(L, title, problem, fixTitle, fixBlocks){
  return ["tog","h4",title,[["call","☹️",problem],["h4",UI[L].act],["call","🙂",[["p","<b>"+fixTitle+"</b>"]].concat(fixBlocks)]]];
}
add("n5",1,5,2,false,{en:"Mobile usability",th:"รองรับการใช้งานบนมือถือ (Mobile Usability)"},
 std("en",
  P("Google has introduced an algorithm that lowers the evaluation of pages not optimized for smartphones.","Addressing mobile usability helps avoid ranking drops caused by a lack of mobile usability."),
  P("There are pages that are not mobile-friendly."),
  P("If you only have pages for PC, please prepare mobile-optimized pages.","※Paste Lighthouse screenshot here※",A("https://developer.chrome.com/docs/lighthouse/overview/?hl=ja&visit_id=638889460586611307-676917179&rd=2#devtools"))
 ).concat([
  ["p","<i>Keep only the applicable items below and delete those that do not apply.</i>"],
  mobileSub("en","Viewport not set",
    P("The viewport is a meta tag that is important for optimizing a site for smartphones. Placing this tag in the site's source resolves the issue. Many of the issues introduced below can also be solved by setting the viewport, so address this with top priority."),
    "If the viewport is not set, please add the following to the head",
    [["code",'<meta name="viewport" content="width=device-width, initial-scale=1">'],["p","Besides initial-scale, the viewport can also have the following attributes:"],["ul",["minimum-scale","maximum-scale","user-scalable"]],
     ["p","Reference: Set the viewport — Web Fundamentals"],["p",A("https://developers.google.com/web/fundamentals/layouts/rwd-fundamentals/set-the-viewport?hl=ja")],
     ["p","By setting the viewport, the browser adjusts the site content to the screen size the user is viewing. Even for sites viewed mostly on PC, please set the viewport."]]),
  mobileSub("en","Fixed-width viewport",
    P("Detected when a specific width is set in the viewport tag's width and that value is not appropriate for the content. A fixed-width viewport ensures content is displayed as intended, but it is a stopgap for making a page smartphone-compatible and is not recommended in Google's guidelines."),
    "Please change the fixed-width viewport setting",
    [["p","If a fixed-width viewport is set, the page will not be mobile-friendly."],["p","If possible, we recommend changing the viewport from a fixed width to a setting such as the following:"],
     ["code",'<meta name="viewport" content="width=device-width, initial-scale=1">'],["p","Reference: Configure the viewport - PageSpeed Insights"],["p",A("https://developers.google.com/speed/docs/insights/ConfigureViewport?hl=ja")],
     ["p","By setting the viewport, the browser adjusts the site content to the screen size the user is viewing. Even for sites viewed mostly on PC, please set the viewport."]]),
  mobileSub("en","Content not sized to the viewport",
    P("If content does not fit the viewport size, users have to scroll horizontally to view the page.","For example, if there are images wider than the viewport, we recommend making the content fit within the viewport width."),
    "Please adjust the content to fit within the viewport width",
    P("Screen sizes and CSS pixel widths vary widely between devices (e.g. between phones and tablets, or between different phones), so to display content properly you must not depend on a specific viewport width.",
      "If you set a large absolute width on page elements in CSS, a div becomes too wide for the viewport of narrow devices (e.g. iPhone, which is 320 CSS pixels wide). Instead, use relative width values such as width: 100%.",
      "Even if the viewport is set correctly, the page may not display well depending on its content. Be careful that high-resolution images etc. do not overflow the site width.")),
  mobileSub("en","Font size too small",
    P("If the font size is too small when viewing a page on a smartphone, the page will be judged as not mobile-friendly.","Therefore, if the page's font size is too small on smartphones, we recommend setting the viewport etc."),
    "Please set the viewport so that fonts scale",
    [["p","After setting the viewport, Google recommends the following:"],["ul",["Use a base font size of 16 CSS pixels.","Define font scaling using sizes relative to the base size.","Text needs vertical space between characters, which may need adjusting per font.","In general, the browser default line height of 1.2 em is recommended.","Limit the number of fonts and scales used. Too many font types and sizes make the page layout cluttered and overly complex."]]]),
  mobileSub("en","Tap targets (buttons/links) too close together",
    P("If links and buttons are placed too close to each other, they lead to mis-taps and the page will be judged as not mobile-friendly. We recommend adjusting the proximity and size of links and buttons so users do not mis-tap."),
    "Make important tap targets large enough to press easily",
    [["p","This applies to tap targets users use frequently — for example, buttons for frequently used actions, the search bar and other important form fields, and main navigation links. These tap targets should be at least 7 mm (48 CSS pixels if the viewport is set properly); if smaller than 7 mm, ensure enough space around them."],
     ["p","<b>Ensure enough space between small tap targets</b>"],
     ["p","Less frequently used links and buttons may be smaller than the recommended 7 mm. However, so that users do not accidentally tap another target when pressing one with their finger, do not place other tap targets within 5 mm (32 CSS pixels) horizontally and vertically."]]),
  mobileSub("en","Flash is used",
    P("Flash generally refers to web content created by combining audio, video and vector-graphics animation. It was once used on many sites, but since it does not display on smartphones, pages using Flash are judged as not mobile-friendly."),
    "Use HTML5 standards for animation",
    P("Make the site comfortable for all users to browse.","Use video embeds that can be played on all devices.","We recommend making video captions available. This enables access for people using assistive browsing features and those whose browsers cannot play proprietary video formats.","Reference: Unplayable content - Mobile guide for webmasters",A("https://developers.google.com/webmasters/mobile-sites/mobile-seo/common-mistakes/unplayable-content?hl=ja")))
 ]),

);

/* ---------- block renderer ---------- */
function rb(blocks){ return (typeof blocks === "string") ? `<p>${blocks}</p>` : blocks.map(rblk).join(""); }
function rblk(b){
  switch(b[0]){
    case "h2": return `<h2>${b[1]}</h2>`;
    case "h3": return `<h3>${b[1]}</h3>`;
    case "h4": return `<h4>${b[1]}</h4>`;
    case "p":  return `<p>${b[1]}</p>`;
    case "ul": return `<ul>${b[1].map(x=>`<li>${x}</li>`).join("")}</ul>`;
    case "ol": return `<ol>${b[1].map(x=>`<li>${x}</li>`).join("")}</ol>`;
    case "code": return `<pre class="code"><code>${esc(b[1])}</code></pre>`;
    case "img": return `<figure class="img"><img src="${esc(b[1])}" alt="" loading="lazy" referrerpolicy="no-referrer"></figure>`;
    case "call": return `<div class="callout${b[1]==="💡"?"":" brown"}"><span class="ico">${b[1]}</span><div class="cb">${rb(b[2])}</div></div>`;
    case "tog": return `<details class="toggle ${b[1]}"${b[4]?" open":""}><summary><span class="tri">${TRI}</span><span class="tt">${b[2]}</span></summary><div class="tb">${rb(b[3])}</div></details>`;
    case "table": {
      const o = b[2]||{};
      const rows = b[1].map((r,i)=>`<tr>${r.map((c,j)=>{ const head = (o.hr&&i===0)||(o.hc&&j===0); return head?`<td class="hc">${c}</td>`:`<td>${c}</td>`; }).join("")}</tr>`).join("");
      return `<div class="tbl-wrap"><table class="simple"><tbody>${rows}</tbody></table></div>`;
    }
    case "sd": return sdTable(true);
    case "cols": return `<div class="cols">${b[1].map(c=>`<div>${rb(c)}</div>`).join("")}</div>`;
    default: return "";
  }
}

/* ---------- database views ---------- */
function dbTable(rows, opts){
  const u = UI[LANG];
  const head = `<thead><tr><th>${u.colNo}</th><th>${u.colTitle}</th><th>${u.colPri}</th><th>${u.colJudge}</th><th>${u.colStatus}</th></tr></thead>`;
  const body = rows.map(it=>`<tr data-go="${it.id}" tabindex="0"><td class="no">${itemNo(it)}<span class="open">${u.open}</span></td><td>${esc(it.title[LANG])}</td><td class="stars">${stars(it.pri)}</td><td>${tagJudge(it.fix)}</td><td>${tagStatus()}</td></tr>`).join("");
  return `<div class="db-scroll"><table class="dbt">${head}<tbody>${body}</tbody></table>${rows.length?"":`<div class="db-empty">${u.noResults}</div>`}</div>`;
}
function dbBlock(k, full){
  const u = UI[LANG];
  const title = u["db"+k];
  let rows = [], bar = "";
  if (k===1) rows = ITEMS.filter(i=>i.grp===1);
  if (k===3) rows = ITEMS.filter(i=>i.grp===3);
  if (k===2) bar = `<div class="db-bar"><button type="button" class="chip">${esc(u.filterLbl)} ▾</button><button type="button" class="chip off">${u.editFilters}</button></div>`;
  const t = full ? "" : `<a class="db-title" href="#/db/${k}">${esc(title)}</a>`;
  return `<div class="db">${t}${bar}${dbTable(rows)}${full&&rows.length?`<div class="db-count">${u.count(rows.length)}</div>`:""}</div>`;
}
function sdTable(inline){
  const u = UI[LANG];
  const head = `<thead><tr>${u.sdCols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead>`;
  const body = SD.map(r=>`<tr style="cursor:default"><td class="no">${esc(r.t[LANG])}</td><td>${esc(r.p[LANG])}</td><td>${A(r.ref, esc(shortUrl(r.ref)))}</td><td>${r.scope}</td><td>${r.url?A(r.url, esc(shortUrl(r.url))):""}</td><td>${r.imp||""}</td><td>${r.err||""}</td><td>${r.fix?esc(r.fix[LANG]):""}</td></tr>`).join("");
  const t = inline ? `<a class="db-title" href="#/db/sd">${esc(u.sdTitle)}</a>` : "";
  return `<div class="db">${t}<div class="db-scroll"><table class="dbt" style="min-width:980px">${head}<tbody>${body}</tbody></table></div></div>`;
}

  friendly:[["call","💡",P("กล่าวง่าย ๆ “Search Engine Friendly” หมายถึง “เป็นที่ชื่นชอบของเครื่องมือค้นหา”","Google อัปเดตอัลกอริทึมหลายครั้งในทุก ๆ วัน โดยมีเป้าหมายเพื่อ “แสดงผลลัพธ์ที่ตรงกับความต้องการของผู้ใช้”","ในการจัดอันดับเว็บไซต์ Google ใช้ปัจจัยมากกว่า 200 ปัจจัย รวมถึงระดับความตรงกับคีย์เวิร์ดที่ค้นหา และอัลกอริทึมก็มีความซับซ้อนมากขึ้นทุกวัน","ในระยะหลังมีแนวโน้มที่ให้ความสำคัญกับเนื้อหา (Content) มากขึ้น แต่การที่เนื้อหาจะได้รับการประเมิน จำเป็นต้องจัดโครงสร้างภายในเว็บไซต์ให้เรียบร้อย","ดังนั้นการดำเนินมาตรการภายในเว็บไซต์อย่างเหมาะสมจึงเป็นสิ่งสำคัญต่อการติดอันดับสูง")]],

  bad:["เว็บไซต์ที่ละเมิดแนวทางของ Google","เว็บไซต์ที่ธีมไม่เป็นหนึ่งเดียวกัน","เว็บไซต์ที่มีหน้าคุณภาพต่ำ เช่น เนื้อหาที่ยกมาจากที่อื่น","เว็บไซต์ที่มีเนื้อหาข้อความในหน้าเป้าหมายน้อย","เว็บไซต์ที่มีลิงก์ออกไปยังหน้าที่มีความเกี่ยวข้องต่ำ","เว็บไซต์ที่มีคำที่ถูกกรอง (Filtering Words)","เว็บไซต์ที่ทำ SEO มากเกินไป","เว็บไซต์ที่มีความหนาแน่นของลิงก์ภายในบล็อกสูง","เว็บไซต์ที่มีหน้าที่ไม่สามารถ Crawl ได้","เว็บไซต์ที่มีหน้าที่แสดงผลช้ามากผิดปกติ","เว็บไซต์ที่มีเนื้อหาซ้ำ"],
  fixes:P("รายการที่ตรวจสอบและผลการตรวจสอบในครั้งนี้มีดังต่อไปนี้","มาตรการโดยละเอียดได้ระบุไว้ในหน้าของแต่ละ No.")
 }
};

function propsHTML(){
  const u = UI[LANG];
  const row = (ic,k,v,empty) => `<div class="prop"><div class="k"><span class="icon-p">${ic}</span>${esc(k)}</div><div class="v${empty?" empty":""}">${v}</div></div>`;
  const E = u.empty;
  let h = row("🔗",u.pURL,A(OD,"owndays.com/sg/en"))
        + row("👤",u.pAnalyst,"米田元洋")
        + row("☰",u.pSiteType,`<span class="tag pink">${u.dbSite}</span><span class="tag green">${u.ecSite}</span>`)
        + row("📅",u.pDate,E,true);
  const more = row("↗",u.pClient,E,true) + row("🕒",u.pCreated,u.created) + row("☰",u.pMeasure,esc(u.measureVal))
        + row("Aa",u.pProject,u.noAccess,true) + row("↗",u.pPM,E,true) + row("≡",u.pResult,E,true)
        + row("≡",u.pDeliv,E,true) + row("≡",u.pPurpose,E,true) + row("≡",u.pIssue,E,true);
  return `<div class="props">${h}${moreProps?more:""}<button type="button" class="more-btn" id="moreBtn">${moreProps?"⌃ "+esc(u.hide(9)):"⌄ "+esc(u.more(9))}</button></div>`;
}

function renderMain(){
  const m = MAIN[LANG], u = UI[LANG];
  const sec = Object.fromEntries(m.sec.map(s=>[s[0],s]));
  const H = id => { const s = sec[id]; return `<${s[1]} id="${id}">${esc(s[2])}</${s[1]}>`; };
  const tocItems = m.sec.map(s=>`<li class="l${s[1]==="h2"?1:s[1]==="h3"?2:3}"><a href="#${s[0]}" data-jump="${s[0]}">${esc(s[2])}</a></li>`).join("");
  return `<article class="page">
    <div class="pg-icon">🛠️</div>
    <h1 class="pg-title">${esc(u.docTitle)}</h1>
    ${propsHTML()}
    <hr class="divider">
    <div class="content">
      <div class="callout" style="padding:8px 12px">
        <details class="toggle" id="tocToggle" style="flex:1"><summary><span class="tri">${TRI}</span><span class="tt" style="font-size:20px;font-weight:600">${esc(m.toc)}</span></summary>
          <div class="tb"><ul class="toc">${tocItems}</ul></div></details>
      </div>
      <div class="callout brown" style="margin-top:28px;padding:10px 14px"><span class="ico">📙</span><div class="cb">${H("intro").replace("<h2","<h2 style=\"margin:0\"")}</div></div>
      ${rb(m.intro)}
      ${H("about")}${rb(m.about)}
      ${H("notes")}${rb(m.notes)}
      <div class="callout brown" style="margin-top:36px;padding:10px 14px"><span class="ico">📙</span><div class="cb">${H("importance").replace("<h2","<h2 style=\"margin:0\"")}</div></div>
      ${H("imp1")}${rb(m.imp1)}
      ${H("imp2")}${rb(m.imp2)}
      ${H("imp3")}${rb(m.imp3)}
      <div class="callout brown" style="margin-top:36px;padding:10px 14px"><span class="ico">📙</span><div class="cb">${H("trends").replace("<h2","<h2 style=\"margin:0\"")}</div></div>
      ${H("friendly")}${rb(m.friendly)}
      <div class="cols">
        <div>${H("good")}<div class="callout"><span class="ico">⭕</span><div class="cb"><ul>${m.good.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div></div>
        <div>${H("bad")}<div class="callout"><span class="ico">❌</span><div class="cb"><ul>${m.bad.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div></div>
      </div>
      <div class="callout brown" style="margin-top:36px;padding:10px 14px"><span class="ico">📙</span><div class="cb">${H("fixes").replace("<h2","<h2 style=\"margin:0\"")}</div></div>
      ${rb(m.fixes)}
      ${dbBlock(1)}${dbBlock(2)}${dbBlock(3)}
      <p class="note">${esc(u.footer)}</p>
    </div>
  </article>`;
}

function renderItem(it){
  const u = UI[LANG];
  const list = ITEMS.filter(i=>i.grp===it.grp);
  const idx = list.indexOf(it), prev = list[idx-1], next = list[idx+1];
  const props = `<div class="props">
     <div class="prop"><div class="k"><span class="icon-p">◎</span>${u.colStatus}</div><div class="v">${tagStatus()}</div></div>
     <div class="prop"><div class="k"><span class="icon-p">Aa</span>${u.colTitle}</div><div class="v">${esc(it.title[LANG])}</div></div>
     <div class="prop"><div class="k"><span class="icon-p">☰</span>${u.colJudge}</div><div class="v">${tagJudge(it.fix)}</div></div>
     <div class="prop"><div class="k"><span class="icon-p">☰</span>${u.colPri}</div><div class="v">${stars(it.pri)}</div></div></div>`;
  const pager = `<nav class="pager">${prev?`<a href="${href(prev.id)}"><small>← ${u.prev}</small>${esc(itemNo(prev))} · ${esc(prev.title[LANG])}</a>`:"<span></span>"}${next?`<a href="${href(next.id)}" style="text-align:right"><small>${u.next} →</small>${esc(itemNo(next))} · ${esc(next.title[LANG])}</a>`:"<span></span>"}</nav>`;
  return `<article class="page">
    <a class="back" href="#/" data-back>← ${u.back}</a>
    <h1 class="pg-title">${esc(itemNo(it))}</h1>
    ${props}<hr class="divider">
    <div class="content">${rb(it.body[LANG])}</div>
    ${pager}
  </article>`;
}

function renderDb(k){
  const u = UI[LANG];
  const title = k==="sd" ? u.sdTitle : u["db"+k];
  const body = k==="sd" ? sdTable(false) : dbBlock(Number(k), true);
  return `<article class="page wide"><a class="back" href="#/" data-back>← ${u.back}</a><h1 class="pg-title">${esc(title)}</h1><div class="content">${body}</div></article>`;
}

/* ---------- breadcrumbs ---------- */
function crumbs(parts){
  document.getElementById("crumbs").innerHTML = parts.map((p,i)=> (i?`<span class="sep">/</span>`:"") + (p.href?`<a href="${p.href}">${esc(p.t)}</a>`:`<span>${esc(p.t)}</span>`)).join("");
}

/* ---------- router ---------- */
function route(keepScroll){
  const u = UI[LANG];
  const h = location.hash;
  const root = {t:"🛠️ "+u.docTitle, href:"#/"};
  let m;
  if ((m = h.match(/^#\/p\/(\w+)/))) {
    const it = ITEMS.find(i=>i.id===m[1]);
    if (it) {
      const db = it.grp===3?3:1;
      app.innerHTML = renderItem(it);
      crumbs([root,{t:u["db"+db],href:`#/db/${db}`},{t:itemNo(it)}]);
      document.title = `${itemNo(it)} – ${it.title[LANG]}`;
      if (!keepScroll) window.scrollTo(0,0);
      return;
    }
  }
  if ((m = h.match(/^#\/db\/(\w+)/))) {
    const k = m[1];
    app.innerHTML = renderDb(k);
    const parts = [root];
    if (k==="sd") parts.push({t:u.db1,href:"#/db/1"},{t:itemNo(ITEMS.find(i=>i.id==="n20")),href:href("n20")});
    parts.push({t:k==="sd"?u.sdTitle:u["db"+k]});
    crumbs(parts);
    document.title = k==="sd"?u.sdTitle:u["db"+k];
    if (!keepScroll) window.scrollTo(0,0);
    return;
  }
  app.innerHTML = renderMain();
  crumbs([{t:"🛠️ "+u.docTitle}]);
  document.title = u.docTitle;
  const anchor = h.replace(/^#\/?/,"");
  if (anchor && document.getElementById(anchor)) document.getElementById(anchor).scrollIntoView();
  else if (!keepScroll && savedMainScroll != null) { window.scrollTo(0, savedMainScroll); }
}
let savedMainScroll = null;

/* ---------- language ---------- */
function setLang(l){
  LANG = l;
  document.documentElement.lang = l;
  try { localStorage.setItem("sfr-lang", l); } catch(e) {}
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.lang===l)));
  const y = window.scrollY;
  route(true);
  window.scrollTo(0,y);
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const lb = e.target.closest(".lang button");
  if (lb) { setLang(lb.dataset.lang); return; }
  if (e.target.closest("#moreBtn")) { moreProps = !moreProps; const y=window.scrollY; route(true); window.scrollTo(0,y); return; }
  const j = e.target.closest("[data-jump]");
  if (j) { e.preventDefault(); const el = document.getElementById(j.dataset.jump); if (el) el.scrollIntoView({behavior:"smooth"}); return; }
  const back = e.target.closest("[data-back]");
  if (back && history.length > 1 && document.referrer === "" && sessionNav > 0) { e.preventDefault(); history.back(); return; }
  if (e.target.closest("a")) return;
  const row = e.target.closest("tr[data-go]");
  if (row) { if (!location.hash || location.hash==="#/" || location.hash==="#") savedMainScroll = window.scrollY; location.hash = href(row.dataset.go); }
});
document.addEventListener("keydown", e=>{
  const row = e.target.closest && e.target.closest("tr[data-go]");
  if (row && (e.key==="Enter"||e.key===" ")) { e.preventDefault(); location.hash = href(row.dataset.go); }
});
let sessionNav = 0;
window.addEventListener("hashchange", ()=>{ sessionNav++; route(false); });
window.addEventListener("scroll", ()=>document.getElementById("topbar").classList.toggle("scrolled", window.scrollY>4), {passive:true});

setLang(LANG);
})();
</script>
