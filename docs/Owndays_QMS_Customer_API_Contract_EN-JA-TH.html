<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owndays QMS Customer API Contract</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0b1220;
    --ink-2:#1f2937;
    --muted:#5b6675;
    --line:#e3e7ed;
    --line-2:#eef1f5;
    --bg:#f6f7f9;
    --card:#ffffff;
    --accent:#0f62fe;
    --accent-soft:#eaf1ff;
    --code-bg:#0d1524;
    --code-ink:#e6edf7;
    --ok:#0f7b4f;
    --warn:#8a5300;
    --warn-bg:#fff8e6;
    --note-bg:#f2f6ff;
    --radius:10px;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:"Inter","Noto Sans JP","Noto Sans Thai",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);font-size:15px;line-height:1.68;
    -webkit-font-smoothing:antialiased;
  }
  html[lang="ja"] body{font-family:"Noto Sans JP","Inter",sans-serif;line-height:1.85}
  html[lang="th"] body{font-family:"Noto Sans Thai","Inter",sans-serif;line-height:1.95}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:50;background:rgba(255,255,255,.88);
    backdrop-filter:saturate(160%) blur(10px);border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    max-width:1120px;margin:0 auto;padding:10px 24px;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.14em;font-size:12px;text-transform:uppercase}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .spacer{flex:1}
  .langswitch{display:inline-flex;background:var(--line-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
  .langswitch button{
    appearance:none;border:0;background:transparent;cursor:pointer;
    font:inherit;font-size:13px;font-weight:600;color:var(--muted);
    padding:5px 14px;border-radius:999px;transition:.15s;white-space:nowrap;
  }
  .langswitch button:hover{color:var(--ink)}
  .langswitch button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(11,18,32,.14)}
  .printbtn{
    appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink-2);
    font:inherit;font-size:13px;font-weight:500;padding:6px 13px;border-radius:8px;cursor:pointer;
  }
  .printbtn:hover{border-color:#c9d1dc}

  /* ---------- layout ---------- */
  .page{max-width:1120px;margin:0 auto;padding:0 24px 96px}
  .hero{padding:44px 0 26px}
  h1{font-size:30px;line-height:1.28;margin:0 0 14px;letter-spacing:-.015em}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .chip{
    font-size:12px;font-weight:500;color:var(--ink-2);background:var(--card);
    border:1px solid var(--line);border-radius:999px;padding:4px 11px;
  }
  .chip b{font-weight:700}
  .chip.env{background:var(--accent-soft);border-color:#cfe0ff;color:#0b47b3}

  .layout{display:grid;grid-template-columns:236px minmax(0,1fr);gap:38px;align-items:start}
  .layout>*{min-width:0}
  main{min-width:0;overflow:hidden}
  @media (max-width:940px){.layout{grid-template-columns:minmax(0,1fr);gap:0}}

  /* ---------- toc ---------- */
  nav.toc{position:sticky;top:64px;font-size:13.5px}
  nav.toc .toc-title{
    font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
    color:var(--muted);margin:0 0 10px;padding-left:12px;
  }
  nav.toc ol{list-style:none;margin:0;padding:0;border-left:1px solid var(--line)}
  nav.toc a{
    display:flex;gap:9px;padding:6px 12px;color:var(--muted);text-decoration:none;
    border-left:2px solid transparent;margin-left:-1px;transition:.12s;
  }
  nav.toc a span.n{color:#9aa5b3;font-variant-numeric:tabular-nums;min-width:12px}
  nav.toc a:hover{color:var(--ink)}
  nav.toc a.active{color:var(--accent);border-left-color:var(--accent);font-weight:600;background:linear-gradient(90deg,var(--accent-soft),transparent)}
  @media (max-width:940px){
    nav.toc{position:static;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:28px}
    nav.toc ol{columns:2;column-gap:16px;border-left:0}
    nav.toc a{border-left:0;padding:5px 0}
  }

  /* ---------- sections ---------- */
  section{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:26px 28px 30px;margin-bottom:22px;scroll-margin-top:72px;
  }
  @media (max-width:640px){section{padding:20px 16px 24px}}
  h2{
    font-size:20px;margin:0 0 18px;padding-bottom:12px;border-bottom:1px solid var(--line-2);
    letter-spacing:-.01em;display:flex;align-items:baseline;gap:11px;
  }
  h2 .num{
    font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);
    border-radius:6px;padding:3px 8px;line-height:1.4;flex:none;
  }
  h3{font-size:15px;margin:26px 0 12px;color:var(--ink-2);display:flex;align-items:baseline;gap:9px}
  h3 .num{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-weight:500;flex:none}
  h3:first-of-type{margin-top:4px}
  p{margin:0 0 12px;color:var(--ink-2)}

  /* ---------- tables ---------- */
  .tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin:0 0 8px}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:420px}
  @media (max-width:640px){
    table{min-width:340px;font-size:12.5px}
    thead th{padding:8px 10px}
    tbody td{padding:9px 10px}
  }
  thead th{
    text-align:left;background:#fafbfc;color:var(--muted);font-weight:600;
    font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;
    padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;
  }
  tbody td{padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:top;color:var(--ink-2)}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#fcfdfe}
  td.k{font-family:var(--mono);font-size:12.5px;color:var(--ink);white-space:nowrap}
  html[lang="ja"] table,html[lang="th"] table{line-height:1.7}

  code{
    font-family:var(--mono);font-size:.885em;background:#f1f3f7;color:#1a2436;
    border:1px solid #e4e8ee;border-radius:4px;padding:1px 5px;white-space:nowrap;
  }
  code.wrap{
    display:inline-block;max-width:100%;white-space:normal;
    overflow-wrap:anywhere;word-break:normal;line-height:1.55;
  }
  td code.wrap{margin:1px 0}
  .req{font-weight:600;color:var(--ok);white-space:nowrap}
  .opt{color:var(--muted);white-space:nowrap}
  .rec{color:var(--warn);white-space:nowrap}
  .pii{
    display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;
    color:#8a1c1c;background:#fdeced;border:1px solid #f7d4d6;border-radius:4px;
    padding:0 5px;margin-left:6px;vertical-align:1px;white-space:nowrap;
  }
  .st{font-family:var(--mono);font-size:12.5px;font-weight:600;white-space:nowrap}
  .st.s4{color:#b4400c}.st.s2{color:var(--ok)}

  /* ---------- code blocks ---------- */
  .cb{position:relative;margin:0 0 14px;border-radius:8px;overflow:hidden;background:var(--code-bg)}
  .cb-head{
    display:flex;align-items:center;gap:10px;padding:8px 12px;
    background:#111b2d;border-bottom:1px solid #1e2b42;
  }
  .cb-tag{
    font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.1em;
    text-transform:uppercase;color:#8fa2bd;
  }
  .cb-head .spacer{flex:1}
  .copy{
    appearance:none;border:1px solid #26354f;background:#16223a;color:#c3d0e3;
    font:inherit;font-size:11.5px;font-weight:500;padding:3px 10px;border-radius:6px;cursor:pointer;
  }
  .copy:hover{background:#1d2c48;color:#fff}
  .copy.done{border-color:#1d5f42;background:#123526;color:#6ee7a8}
  .cb pre{
    margin:0;padding:14px 16px;overflow-x:auto;
    font-family:var(--mono);font-size:12.5px;line-height:1.72;color:var(--code-ink);
    white-space:pre;tab-size:2;
  }
  .cb pre::-webkit-scrollbar{height:9px}
  .cb pre::-webkit-scrollbar-thumb{background:#2b3b57;border-radius:9px}

  .flow{
    margin:0 0 16px;padding:16px 18px;background:#0d1524;border-radius:8px;
    font-family:var(--mono);font-size:12.5px;line-height:1.9;color:#cdd9ea;
    overflow-x:auto;white-space:pre;
  }
  .flow b{color:#7fb2ff;font-weight:500}

  /* ---------- notes ---------- */
  .note{
    border-left:3px solid var(--accent);background:var(--note-bg);
    padding:13px 16px;border-radius:0 8px 8px 0;margin:0 0 16px;font-size:13.5px;color:var(--ink-2);
  }
  .note.warn{border-left-color:#d99100;background:var(--warn-bg)}
  .note .lbl{font-weight:700;color:var(--ink);margin-right:6px}

  footer{
    max-width:1120px;margin:0 auto;padding:26px 24px 0;border-top:1px solid var(--line);
    color:var(--muted);font-size:12.5px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
  }
  [hidden]{display:none !important}

  @media print{
    .topbar,nav.toc,.copy{display:none}
    body{background:#fff;font-size:10.5pt}
    .layout{display:block}
    section{border-color:#ccc;margin-bottom:14px;padding:14px}
    h2{break-after:avoid}h3{break-after:avoid}
    .cb,.flow,tr,.note{break-inside:avoid}
    thead{display:table-header-group}
    .cb{background:#f4f6f9}
    .cb pre{color:#111;white-space:pre-wrap;word-break:break-all}
    .cb-head{background:#e8ecf1;border-color:#d5dbe3}
    .cb-tag{color:#4a5666}
    .flow{background:#f4f6f9;color:#111;white-space:pre-wrap}
    .flow b{color:#0b47b3}
  }
</style>
</head>

/* ============ renderer ============ */
let LANG = "en";
const tx = (v) => (v && typeof v === "object" && !Array.isArray(v)) ? (v[LANG] ?? v.en) : v;

function renderTable(b){
  const head = b.head.map(h=>`<th>${tx(h)}</th>`).join("");
  const rows = b.rows.map(r=>{
    const tds = r.map((c,i)=>{
      const cls = (b.colk===i) ? ' class="k"' : "";
      return `<td${cls}>${tx(c)}</td>`;
    }).join("");
    return `<tr>${tds}</tr>`;
  }).join("");
  return `<div class="tw"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function renderCode(b){
  const src = CODE[b.key] || "";
  const esc = src.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  return `<div class="cb"><div class="cb-head"><span class="cb-tag">${b.tag}</span><span class="spacer"></span>`+
         `<button type="button" class="copy" data-key="${b.key}">${UI.copy[LANG]}</button></div>`+
         `<pre>${esc}</pre></div>`;
}

function renderBlock(b){
  switch(b.t){
    case "table": return renderTable(b);
    case "code":  return renderCode(b);
    case "flow":  return `<div class="flow">${tx(b.lines).join("\n")}</div>`;
    case "note":  return `<div class="note${b.cls?" "+b.cls:""}"><span class="lbl">${tx(b.lbl)}:</span>${tx(b.text)}</div>`;
    case "h3":    return `<h3><span class="num">${b.num}</span><span>${tx(b.title)}</span></h3>`;
    case "p":     return `<p>${tx(b.text)}</p>`;
    default:      return "";
  }
}

function render(){
  document.documentElement.lang = LANG;
  document.title = UI.docTitle[LANG];
  document.getElementById("doc-title").textContent = UI.docTitle[LANG];
  document.getElementById("toc-title").textContent = UI.toc[LANG];
  document.getElementById("printbtn").textContent = UI.print[LANG];
  document.getElementById("foot-left").innerHTML = UI.footLeft[LANG];
  document.getElementById("foot-right").textContent = UI.footRight[LANG];

  document.getElementById("doc-chips").innerHTML = [
    `<span class="chip">${UI.chipService[LANG]}: <b>juno-customer</b></span>`,
    `<span class="chip">${UI.chipVersion[LANG]}: <b>1.0</b></span>`,
    `<span class="chip">${UI.chipUpdated[LANG]}: <b>${UI.chipUpdatedVal[LANG]}</b></span>`,
    `<span class="chip env">${UI.chipEnv[LANG]}</span>`
  ].join("");

  document.getElementById("toc-list").innerHTML = DOC.map(s=>
    `<li><a href="#${s.id}" data-target="${s.id}"><span class="n">${s.num}</span><span>${tx(s.title)}</span></a></li>`
  ).join("");

  document.getElementById("doc-body").innerHTML = DOC.map(s=>
    `<section id="${s.id}"><h2><span class="num">${s.num}</span><span>${tx(s.title)}</span></h2>`+
    s.blocks.map(renderBlock).join("")+`</section>`
  ).join("");

  document.querySelectorAll("#langswitch button").forEach(btn=>
    btn.setAttribute("aria-pressed", String(btn.dataset.lang === LANG))
  );
  observeSections();
}

/* ---- copy buttons ---- */
document.addEventListener("click", async (e)=>{
  const btn = e.target.closest(".copy");
  if(!btn) return;
  const text = CODE[btn.dataset.key] || "";
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); }
    else{
      const ta=document.createElement("textarea");
      ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
    }
    btn.textContent = UI.copied[LANG]; btn.classList.add("done");
    setTimeout(()=>{ btn.textContent = UI.copy[LANG]; btn.classList.remove("done"); }, 1600);
  }catch(_){ /* clipboard blocked */ }
});

/* ---- language switch ---- */
document.getElementById("langswitch").addEventListener("click",(e)=>{
  const btn = e.target.closest("button[data-lang]");
  if(!btn) return;
  const prev = document.querySelector("section:target") ? null : null;
  LANG = btn.dataset.lang;
  const y = window.scrollY;
  render();
  window.scrollTo({top:y});
});

document.getElementById("printbtn").addEventListener("click",()=>window.print());

/* ---- active TOC highlight ---- */
let io = null;
function observeSections(){
  if(io) io.disconnect();
  const links = new Map();
  document.querySelectorAll("#toc-list a").forEach(a=>links.set(a.dataset.target,a));
  io = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{
      if(en.isIntersecting){
        links.forEach(a=>a.classList.remove("active"));
        const a = links.get(en.target.id);
        if(a) a.classList.add("active");
      }
    });
  },{rootMargin:"-70px 0px -70% 0px",threshold:0});
  document.querySelectorAll("main section").forEach(s=>io.observe(s));
}

/* ---- init: honour ?lang= and browser locale ---- */
(function init(){
  const p = new URLSearchParams(location.search).get("lang");
  if(p && ["en","ja","th"].includes(p)) LANG = p;
  else{
    const n = (navigator.language||"").toLowerCase();
    if(n.startsWith("ja")) LANG="ja";
    else if(n.startsWith("th")) LANG="th";
  }
  render();
})();
</script>
